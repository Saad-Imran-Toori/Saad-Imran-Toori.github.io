<style>
:root{
  --void:#06070A;
  --text:#E9EBF2;
  --edge:#7FA8FF;
  --evidence:#46C88A;
  --display:"Space Grotesk","Helvetica Neue",Arial,sans-serif;
  --body:"Inter",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--void);
  color:var(--text);
  font-family:var(--body);
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}

.film{
  position:relative;
  height:100svh;min-height:100%;
  overflow:hidden;
  display:flex;align-items:flex-end;
  background:var(--void);
}
.film video{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:60% 50%;
  filter:saturate(.95) contrast(1.05) brightness(.9);
}
.scrim{
  position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(to top, rgba(6,7,10,.95) 0%, rgba(6,7,10,.58) 26%, rgba(6,7,10,.10) 56%, rgba(6,7,10,.45) 100%),
    linear-gradient(to right, rgba(6,7,10,.70) 0%, rgba(6,7,10,.08) 54%, rgba(6,7,10,0) 100%);
}
.grain{
  position:absolute;inset:0;pointer-events:none;opacity:.13;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='120' height='120' filter='url(%23g)'/></svg>");
  animation:grainshift 1.1s steps(3) infinite;
}
@keyframes grainshift{0%{transform:translate(0,0)}33%{transform:translate(-2%,1%)}66%{transform:translate(1%,-2%)}}

.copy{
  position:relative;z-index:2;width:100%;
  max-width:1120px;margin:0 auto;
  padding-inline:clamp(22px,5vw,54px);
  padding-bottom:clamp(52px,9vh,104px);
}
.eyebrow{
  font-family:var(--mono);font-size:clamp(10px,1.1vw,11.5px);
  letter-spacing:.17em;text-transform:uppercase;color:var(--edge);
  margin:0 0 16px;display:flex;align-items:center;gap:11px;flex-wrap:wrap;
}
.eyebrow s{display:block;width:26px;height:1px;background:var(--edge);text-decoration:none;opacity:.65}
h1{
  font-family:var(--display);font-weight:700;
  font-size:clamp(32px,7.6vw,92px);
  line-height:.96;letter-spacing:-.036em;margin:0;
  text-shadow:0 4px 44px rgba(0,0,0,.65);
  text-wrap:balance;
}
.role{
  margin:18px 0 0;max-width:44ch;
  font-size:clamp(14.5px,1.75vw,17.5px);opacity:.88;
  text-shadow:0 2px 22px rgba(0,0,0,.75);
}
.role b{font-weight:500;color:#fff}
.mail{
  display:inline-block;margin-top:26px;
  font-family:var(--mono);font-size:clamp(11px,1.2vw,12.5px);
  letter-spacing:.09em;color:var(--text);text-decoration:none;
  border-bottom:1px solid rgba(233,235,242,.32);padding-bottom:4px;
  transition:color .2s,border-color .2s;
}
.mail:hover,.mail:focus-visible{color:var(--evidence);border-bottom-color:var(--evidence)}
.mail:focus-visible{outline:2px solid var(--edge);outline-offset:4px}

@media (max-width:760px){
  .film video{object-position:64% 50%}
  .copy{padding-bottom:clamp(40px,7vh,72px)}
}
</style>
</head>
<body>
<section class="film">
  <video id="hv" playsinline muted loop preload="auto" poster="hero-poster.jpg"
         width="1280" height="720"
         aria-label="Saad at his desk writing code, with his cat beside the keyboard">
    <source src="hero.mp4" type="video/mp4">
  </video>
  <span class="scrim" aria-hidden="true"></span>
  <span class="grain" aria-hidden="true"></span>

  <div class="copy">
    <p class="eyebrow"><s></s>Software engineer · Islamabad, Pakistan</p>
    <h1>Muhammad Saad Imran</h1>
    <p class="role">Retrieval systems, ranking models, and platforms that <b>show their evidence</b> — and say <b>no match</b> instead of guessing.</p>
    <a class="mail" href="mailto:saad.imran.xd@gmail.com?subject=Setting%20up%20a%20call">saad.imran.xd@gmail.com</a>
  </div>
</section>

<script>
// the video plays, always
(function () {
  var v = document.getElementById('hv');
  if (!v) return;
  v.muted = true; v.defaultMuted = true; v.setAttribute('muted',''); v.loop = true;
  function go(){ var p = v.play(); if (p && p.catch) p.catch(function(){}); }
  go();
  ['pause','stalled','suspend','waiting','ended'].forEach(function(e){
    v.addEventListener(e, function(){ setTimeout(go, 60); });
  });
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) go(); });
  window.addEventListener('pageshow', go);
  window.addEventListener('focus', go);
})();
</script>
</body>
</html>
